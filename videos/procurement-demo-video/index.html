<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f8f9fa;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f8f9fa;
      }
      .screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transform-origin: center center;
      }
      .scenario-label {
        position: absolute;
        top: 54px;
        left: 58px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 20px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 999px;
        background: rgba(0, 84, 163, 0.92);
        box-shadow: 0 14px 32px rgba(26, 26, 46, 0.18);
        color: #ffffff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.01em;
        opacity: 0;
      }
      .scenario-number {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.12em;
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="49.2"
      data-width="1920"
      data-height="1080"
    >
      <img id="s1-input" class="clip screen" src="assets/scenarios/01_high_traffic-input.png" data-start="0" data-duration="2.8" data-track-index="1" />
      <img id="s1-plan" class="clip screen" src="assets/scenarios/01_high_traffic-plan.png" data-start="2.4" data-duration="6.0" data-track-index="2" />
      <img id="s2-input" class="clip screen" src="assets/scenarios/02_holiday_promo-input.png" data-start="8.1" data-duration="2.8" data-track-index="1" />
      <img id="s2-plan" class="clip screen" src="assets/scenarios/02_holiday_promo-plan.png" data-start="10.5" data-duration="6.0" data-track-index="2" />
      <img id="s3-input" class="clip screen" src="assets/scenarios/03_low_budget-input.png" data-start="16.2" data-duration="2.8" data-track-index="1" />
      <img id="s3-plan" class="clip screen" src="assets/scenarios/03_low_budget-plan.png" data-start="18.6" data-duration="6.0" data-track-index="2" />
      <img id="s4-input" class="clip screen" src="assets/scenarios/04_long_shelf-input.png" data-start="24.3" data-duration="2.8" data-track-index="1" />
      <img id="s4-plan" class="clip screen" src="assets/scenarios/04_long_shelf-plan.png" data-start="26.7" data-duration="6.0" data-track-index="2" />
      <img id="s5-input" class="clip screen" src="assets/scenarios/05_fruit_focus-input.png" data-start="32.4" data-duration="2.8" data-track-index="1" />
      <img id="s5-plan" class="clip screen" src="assets/scenarios/05_fruit_focus-plan.png" data-start="34.8" data-duration="6.0" data-track-index="2" />
      <img id="s6-input" class="clip screen" src="assets/scenarios/06_no_budget-input.png" data-start="40.5" data-duration="2.8" data-track-index="1" />
      <img id="s6-plan" class="clip screen" src="assets/scenarios/06_no_budget-plan.png" data-start="42.9" data-duration="6.0" data-track-index="2" />

      <div id="l1" class="clip scenario-label" data-start="0" data-duration="8.1" data-track-index="3"><span class="scenario-number">01</span><span>High traffic and budget optimization</span></div>
      <div id="l2" class="clip scenario-label" data-start="8.1" data-duration="8.1" data-track-index="3"><span class="scenario-number">02</span><span>Christmas promotion readiness</span></div>
      <div id="l3" class="clip scenario-label" data-start="16.2" data-duration="8.1" data-track-index="3"><span class="scenario-number">03</span><span>Low budget stockout prevention</span></div>
      <div id="l4" class="clip scenario-label" data-start="24.3" data-duration="8.1" data-track-index="3"><span class="scenario-number">04</span><span>Long shelf-life preference</span></div>
      <div id="l5" class="clip scenario-label" data-start="32.4" data-duration="8.1" data-track-index="3"><span class="scenario-number">05</span><span>Fruit category focus</span></div>
      <div id="l6" class="clip scenario-label" data-start="40.5" data-duration="8.4" data-track-index="3"><span class="scenario-number">06</span><span>No budget constraint</span></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const clips = [
        ["s1-input", 0, 2.8], ["s1-plan", 2.4, 6.0], ["s2-input", 8.1, 2.8], ["s2-plan", 10.5, 6.0],
        ["s3-input", 16.2, 2.8], ["s3-plan", 18.6, 6.0], ["s4-input", 24.3, 2.8], ["s4-plan", 26.7, 6.0],
        ["s5-input", 32.4, 2.8], ["s5-plan", 34.8, 6.0], ["s6-input", 40.5, 2.8], ["s6-plan", 42.9, 6.0],
      ];
      clips.forEach(([id, start, duration], index) => {
        tl.fromTo(`#${id}`, { opacity: 0, scale: 1 }, { opacity: 1, scale: 1.025, duration: 0.45, ease: "power2.out" }, start);
        tl.to(`#${id}`, { scale: 1.04, duration: duration - 0.45, ease: "none" }, start + 0.45);
        if (index < clips.length - 1) {
          tl.to(`#${id}`, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, start + duration - 0.35);
        }
      });
      const labelClips = [
        ["l1", 0, 8.1], ["l2", 8.1, 8.1], ["l3", 16.2, 8.1],
        ["l4", 24.3, 8.1], ["l5", 32.4, 8.1], ["l6", 40.5, 8.4],
      ];
      labelClips.forEach(([labelId, start, duration]) => {
        tl.fromTo(`#${labelId}`, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, start + 0.18);
        tl.to(`#${labelId}`, { opacity: 0, duration: 0.25, ease: "power2.in" }, start + duration - 0.25);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
